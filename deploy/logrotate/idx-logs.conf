# User-level logrotate config for the repo's logs/ (run from the repo root by
# deploy/systemd/idx-logrotate.timer -- relative patterns resolve against it).
#
# copytruncate: cron_wrap.sh re-opens its log with >> on every run, and
#   gunicorn/the scheduler keep app logs open.
# size 5M (not a time trigger): rotation resets a log's mtime and
#   check_backup_heartbeat.py reads the mtime of cron_db_backup*.log as its
#   job-still-fires signal, so small, frequently-checked logs must never
#   rotate on a schedule.
"./logs/cron_*.log" "./logs/heartbeat_check.log" {
    size 5M
    rotate 4
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
