{% extends "base.html" %}
{% block title %}Sector Rotation — IDX Suite{% endblock %}
{% block head %}
<style>
  .sector-page { padding:16px; display:flex; flex-direction:column; gap:16px; }
  .sector-page .panel { background:var(--surface,#0e1320); border:1px solid var(--border,#1b2233); border-radius:12px; overflow:hidden; }
  .sector-page .panel-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border,#1b2233); }
  .sector-page .panel-head h2 { margin:0; font-size:14px; }
  .sector-page .asof { font-size:11px; color:var(--text-mute,#7a8499); }
  .hm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; padding:14px 16px; }
  .hm-card { border:1px solid var(--border,#1b2233); border-radius:10px; padding:10px 12px; }
  .hm-card .name { font-weight:600; font-size:12.5px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .hm-card .rets { display:flex; gap:14px; margin-top:8px; font-family:var(--mono,monospace); font-size:11px; }
  .hm-card .rets span { display:block; color:var(--text-mute,#7a8499); font-size:9px; letter-spacing:.05em; }
  .wbadge { font-size:9px; padding:1px 6px; border-radius:4px; font-weight:700; white-space:nowrap; }
  table.sector-data { width:100%; border-collapse:collapse; }
  table.sector-data th, table.sector-data td { padding:8px 12px; text-align:left; font-size:12px; border-bottom:1px solid var(--border,#1b2233); }
  table.sector-data th { color:var(--text-mute,#7a8499); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; }
  table.sector-data td.num, table.sector-data th.num { text-align:right; font-family:var(--mono,monospace); }
  .pos { color:var(--green,#10b981); } .neg { color:var(--red,#ef4444); }
  .sector-page .empty { padding:40px; text-align:center; color:var(--text-mute,#7a8499); font-size:13px; }
</style>
{% endblock %}
{% block content %}
<div class="sector-page">
  <div class="panel">
    <div class="panel-head"><h2>Sector Heatmap</h2><span class="asof" id="sec-asof"></span></div>
    <div class="hm-grid" id="hm-grid"><div class="empty">Loading…</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Sector Rotation</h2><button class="btn btn-sm" onclick="loadSector()">↻ Refresh</button></div>
    <table class="sector-data">
      <thead><tr>
        <th>#</th><th>Sector</th><th>Weight</th>
        <th class="num">Score</th><th class="num">5d</th><th class="num">10d</th><th class="num">20d</th><th class="num">N</th>
      </tr></thead>
      <tbody id="rot-tbody"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block view_init %}
<script>
function _pct(v){ if(v==null||isNaN(v)) return '—'; const s=v>=0?'+':''; return `<span class="${v>=0?'pos':'neg'}">${s}${v.toFixed(2)}%</span>`; }
function _hbg(v){ if(v==null) return 'transparent'; if(v>=1.5) return 'rgba(16,185,129,.22)'; if(v>=0.2) return 'rgba(16,185,129,.10)'; if(v>=-0.2) return 'transparent'; if(v>=-1.5) return 'rgba(239,68,68,.10)'; return 'rgba(239,68,68,.22)'; }
function _wbadge(w){ const m={OVERWEIGHT:['▲ OW','#10b981','rgba(16,185,129,.15)'],UNDERWEIGHT:['▼ UW','#ef4444','rgba(239,68,68,.15)']}; const x=m[w]||['– NE','#7a8499','rgba(122,132,153,.12)']; return `<span class="wbadge" style="color:${x[1]};background:${x[2]}">${x[0]}</span>`; }
async function loadSector(){
  const grid = document.getElementById('hm-grid');
  const tb = document.getElementById('rot-tbody');
  try{
    const d = await fetch('/api/sector/rotation').then(r=>r.json());
    const sectors = d.sectors || (Array.isArray(d) ? d : []);
    if(!sectors.length){ grid.innerHTML='<div class="empty">No sector data available</div>'; tb.innerHTML='<tr><td colspan="8" class="empty">No sector data</td></tr>'; return; }
    grid.innerHTML = sectors.map(s=>`
      <div class="hm-card" style="background:${_hbg(s.ret_20d)}">
        <div class="name"><span>${s.sector}</span>${_wbadge(s.weight)}</div>
        <div class="rets">
          <div><span>5D</span>${_pct(s.ret_5d)}</div>
          <div><span>10D</span>${_pct(s.ret_10d)}</div>
          <div><span>20D</span>${_pct(s.ret_20d)}</div>
        </div>
      </div>`).join('');
    tb.innerHTML = sectors.map((s,i)=>`
      <tr>
        <td style="color:var(--text-mute)">${i+1}</td>
        <td><strong>${s.sector}</strong></td>
        <td>${_wbadge(s.weight)}</td>
        <td class="num">${s.score!=null?Number(s.score).toFixed(2):'—'}</td>
        <td class="num">${_pct(s.ret_5d)}</td>
        <td class="num">${_pct(s.ret_10d)}</td>
        <td class="num">${_pct(s.ret_20d)}</td>
        <td class="num" style="color:var(--text-mute)">${s.n_tickers||0}</td>
      </tr>`).join('');
    const asof = d.as_of || d.date || d.asof;
    if(asof) document.getElementById('sec-asof').textContent = 'as of ' + asof;
  }catch(e){
    grid.innerHTML = '<div class="empty">Error: '+e.message+'</div>';
    tb.innerHTML = '<tr><td colspan="8" class="empty">Error loading sector data</td></tr>';
  }
}
loadSector();
</script>
{% endblock %}
