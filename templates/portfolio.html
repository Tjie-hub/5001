{% extends "base.html" %}
{% block title %}Portfolio — IDX Suite{% endblock %}
{% block content %}

<!-- Frontend freeze (owner-directed 2026-10-06): the legacy portfolio UI
     (holdings, funds, dividends, editing forms) was retired because this
     store stopped at 2026-04-14 and jurnal26 (port 5004) is the live ledger.
     The inv_* tables and /api/v1/investments* routes are kept — only the UI
     surface was removed. -->
<div style="max-width:640px;margin:48px auto;padding:0 20px;">
  <h1 style="font:600 20px/1.4 'Inter',sans-serif;color:var(--text,#e8edf4);margin:0 0 12px;">
    Portfolio — frozen
  </h1>
  <p style="font:400 14px/1.6 'Inter',sans-serif;color:var(--text-mute,#8a93a6);margin:0 0 10px;">
    This portfolio store stopped at 2026-04-14 and is no longer maintained.
  </p>
  <p style="font:400 14px/1.6 'Inter',sans-serif;color:var(--text-mute,#8a93a6);margin:0;">
    Portfolio, watchlist and daily research live in
    <a href="#" id="portfolio-jurnal26-link" style="color:var(--text,#e8edf4);"><strong>jurnal26 :5004</strong></a>.
  </p>
</div>
<script>
  (function () {
    var a = document.getElementById('portfolio-jurnal26-link');
    if (a) a.href = 'http://' + window.location.hostname + ':5004/';
  })();
</script>
{% endblock %}
