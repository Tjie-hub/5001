<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-Pane Charts</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">▚ Multi-Pane Charts</div>

    <div class="panes-select">
      <span class="lbl">Panes</span>
      <div id="paneButtons">
        <button data-n="1">1</button>
        <button data-n="2">2</button>
        <button data-n="4" class="active">4</button>
        <button data-n="6">6</button>
        <button data-n="8">8</button>
      </div>
    </div>

    <div id="sessions" class="sessions">
      <span class="badge" data-mkt="IDX">WIB <i></i></span>
      <span class="badge" data-mkt="US">US <i></i></span>
      <span class="badge" data-mkt="Crypto">Crypto <i></i></span>
    </div>
  </header>

  <main id="grid" class="grid" data-panes="4"></main>

  <!-- Template for one pane (cloned per chart) -->
  <template id="paneTpl">
    <section class="pane">
      <div class="pane-head">
        <input class="sym" type="text" placeholder="Symbol" />
        <select class="mkt">
          <option value="IDX">IDX</option>
          <option value="US">US</option>
          <option value="Crypto">Crypto</option>
        </select>
        <select class="tf">
          <option>1m</option><option>5m</option><option>15m</option>
          <option>30m</option><option>1h</option>
          <option selected>1d</option><option>1wk</option><option>1mo</option>
        </select>
        <div class="inds"></div>
        <span class="status"></span>
      </div>
      <div class="pane-body"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
