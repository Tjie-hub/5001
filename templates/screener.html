{% extends "base.html" %}
{% block title %}Fundamental Screener — IDX Suite{% endblock %}
{% block head %}
<style>
:root {
  --bg: #060b18;
  --bg-elev: #0b1024;
  --surface: #0f162e;
  --surface-2: #151d3a;
  --surface-3: #1b2547;
  --border: #1b2547;
  --border-soft: #151f3a;
  --border-hi: #263358;
  --text: #e8edf8;
  --text-dim: #97a3c0;
  --text-mute: #5c6890;
  --indigo: #6366f1;
  --indigo-2: #818cf8;
  --indigo-dim: rgba(99,102,241,0.16);
  --indigo-ring: rgba(99,102,241,0.40);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.14);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.14);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.14);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.14);
  --gray-dim: rgba(151,163,192,0.10);
  --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 4px 16px rgba(0,0,0,0.4);
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select { font-family: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 12px; }
input:focus, select:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-dim); }
select { cursor: pointer; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }
.mono { font-family: var(--mono); }

/* Layout */
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: 48px; background: rgba(10,14,26,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
}
.topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.topbar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.topbar nav { display: flex; gap: 4px; margin-left: 8px; }
.topbar nav a { color: var(--text-dim); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; transition: all 0.15s; }
.topbar nav a:hover, .topbar nav a.active { color: var(--text); background: var(--surface-2); }
.topbar .spacer { flex: 1; }

.main { display: flex; height: calc(100vh - 48px); overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 280px; min-width: 280px; background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto;
}
.sidebar-section { padding: 12px; border-bottom: 1px solid var(--border-soft); }
.sidebar-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-mute); margin-bottom: 8px; font-weight: 600; }
.sidebar-section label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }

/* Column list */
.col-list { max-height: 220px; overflow-y: auto; }
.col-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: all 0.12s; user-select: none; }
.col-item:hover { background: var(--surface); }
.col-item.selected { background: var(--indigo-dim); color: var(--indigo-2); }
.col-item .check { width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
.col-item.selected .check { border-color: var(--indigo); background: var(--indigo); color: #fff; }
.col-item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Content */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; background: var(--bg-elev);
}
.toolbar-group { display: flex; align-items: center; gap: 6px; }
.toolbar-group label { font-size: 11px; color: var(--text-mute); white-space: nowrap; }
.btn {
  padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn-primary { background: var(--indigo); color: #fff; }
.btn-primary:hover { background: var(--indigo-2); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-outline:hover { background: var(--surface-2); color: var(--text); }
.btn-ghost { color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--surface); }
.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-xs { padding: 2px 7px; font-size: 10px; border-radius: 4px; }

/* Filters */
.filter-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; background: var(--bg-elev); }
.filter-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 4px; font-size: 11px; background: var(--surface); border: 1px solid var(--border); }
.filter-tag .remove { cursor: pointer; color: var(--text-mute); font-weight: bold; margin-left: 2px; }
.filter-tag .remove:hover { color: var(--red); }
.filter-tag select, .filter-tag input { padding: 2px 6px; font-size: 11px; border-radius: 3px; min-width: 60px; }
.filter-tag input { width: 80px; }

/* Results table */
.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead { position: sticky; top: 0; z-index: 10; }
th {
  background: var(--surface-2); padding: 8px 12px; text-align: left;
  font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-dim); border-bottom: 2px solid var(--border); white-space: nowrap;
  cursor: pointer; user-select: none;
}
th:hover { color: var(--text); }
th.sorted { color: var(--indigo-2); }
th .sort-arrow { margin-left: 3px; font-size: 10px; }
td {
  padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
tr:hover td { background: var(--surface); }
td.ticker { font-weight: 600; color: var(--indigo-2); cursor: pointer; }
td.positive { color: var(--green); }
td.negative { color: var(--red); }
td.neutral { color: var(--text-dim); }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-top: 1px solid var(--border-soft); background: var(--bg-elev);
  font-size: 12px; color: var(--text-dim);
}
.pagination .pages { display: flex; align-items: center; gap: 4px; }
.pagination .pages button {
  padding: 5px 10px; border-radius: 5px; font-size: 12px; color: var(--text-dim); background: transparent; border: 1px solid var(--border);
}
.pagination .pages button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.pagination .pages button.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
.pagination .pages button:disabled { opacity: 0.3; cursor: default; }

/* Loading/error */
.loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--text-mute); }
.loading .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--indigo); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { padding: 20px; color: var(--red); text-align: center; }
.empty { padding: 40px; text-align: center; color: var(--text-mute); }

/* Badge */
.badge {
  display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600;
}
.badge-bullish { background: var(--green-dim); color: var(--green); }
.badge-bearish { background: var(--red-dim); color: var(--red); }
.badge-neutral { background: var(--gray-dim); color: var(--text-dim); }
.badge-strong { background: var(--blue-dim); color: var(--blue); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .toolbar { flex-direction: column; align-items: stretch; }
}
</style>
{% endblock %}
{% block content %}
<div class="main">
  <!-- Sidebar: Column Selection + Presets -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>Universe</h3>
      <select id="universe" style="width:100%">
        <option value="ALL">All Stocks (972 tickers)</option>
        <option value="IDX80">IDX80</option>
        <option value="LQ45">LQ45</option>
        <option value="IDX30">IDX30</option>
        <option value="NON_IDX">Non-Index</option>
      </select>
    </div>

    <div class="sidebar-section">
      <h3>Stockbit Filter <span id="sbBadge" style="display:none;background:var(--indigo);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;margin-left:4px"></span></h3>
      <select id="sbTemplate" style="width:100%" onchange="onSbTemplateChange()">
        <option value="">— None —</option>
        <option value="63">High Volume Breakout</option>
        <option value="77">Foreign Flow Uptrend</option>
      </select>
      <div id="sbStatus" style="font-size:10px;color:var(--text-mute);margin-top:4px"></div>
    </div>

    <div class="sidebar-section">
      <h3>Presets</h3>
      <select id="preset" style="width:100%" onchange="loadPreset(this.value)">
        <option value="">— Custom —</option>
      </select>
    </div>

    <div class="sidebar-section">
      <h3>Columns <span style="font-weight:400;color:var(--text-mute);font-size:10px" id="colCount">(9 selected)</span></h3>
      <div class="col-list" id="colList"></div>
    </div>

    <div class="sidebar-section">
      <h3>Sort</h3>
      <select id="sortCol" style="width:100%;margin-bottom:4px"></select>
      <select id="sortDir" style="width:100%">
        <option value="ASC">Ascending</option>
        <option value="DESC">Descending</option>
      </select>
    </div>

    <div class="sidebar-section">
      <h3>Export</h3>
      <button class="btn btn-outline btn-sm" onclick="exportCSV()" style="width:100%">📥 Export CSV</button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="content">
    <!-- Filter bar -->
    <div class="filter-bar" id="filterBar">
      <span style="font-size:11px;color:var(--text-mute)">Filters:</span>
      <button class="btn btn-outline btn-xs" onclick="addFilter()">+ Add Rule</button>
      <button class="btn btn-ghost btn-xs" onclick="clearFilters()" id="clearFiltersBtn" style="display:none">Clear All</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="btn btn-primary btn-sm" onclick="runQuery()">🔍 Search</button>
        <span style="color:var(--text-mute);font-size:11px" id="resultCount"></span>
      </div>
      <div class="spacer" style="flex:1"></div>
      <div class="toolbar-group">
        <label>Per page:</label>
        <select id="perpage" onchange="runQuery()">
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Results -->
    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div> Loading columns...</div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination" style="display:none">
      <span id="pageInfo"></span>
      <div class="pages" id="pageButtons"></div>
    </div>
  </div>
</div>

<script>
// ── State ──
const COLUMNS = [];
let selectedCols = ['ticker','pe_ttm','pbv','roe','der','npm','rev_growth','flow_score','flow_verdict'];
let currentSort = { col: 'ticker', dir: 'ASC' };
let currentPage = 1, totalPages = 1, totalRows = 0;
let filters = [];
let presets = {};

// ── Init ──
async function init() {
  try {
    const res = await fetch('/api/screener/columns');
    const data = await res.json();
    Object.entries(data).forEach(([key, info]) => {
      COLUMNS.push({ key, ...info });
    });
  } catch(e) {
    // Fallback: hardcoded columns
    COLUMNS.push(
      {key:'ticker',label:'Ticker',type:'text'},
      {key:'pe_ttm',label:'PE (TTM)',type:'float'},
      {key:'pe_forward',label:'PE (Forward)',type:'float'},
      {key:'pbv',label:'PBV',type:'float'},
      {key:'ps_ttm',label:'P/S',type:'float'},
      {key:'eps_ttm',label:'EPS',type:'float'},
      {key:'roe',label:'ROE %',type:'float'},
      {key:'roa',label:'ROA %',type:'float'},
      {key:'der',label:'D/E',type:'float'},
      {key:'npm',label:'Net Margin %',type:'float'},
      {key:'div_yield',label:'Div Yield %',type:'float'},
      {key:'rev_growth',label:'Rev Growth %',type:'float'},
      {key:'earn_growth',label:'Earn Growth %',type:'float'},
      {key:'current_ratio',label:'Current Ratio',type:'float'},
      {key:'quick_ratio',label:'Quick Ratio',type:'float'},
      {key:'peg_ratio',label:'PEG',type:'float'},
      {key:'ev_ebitda',label:'EV/EBITDA',type:'float'},
      {key:'pcf_ttm',label:'P/CF',type:'float'},
      {key:'flow_score',label:'Flow Score',type:'int'},
      {key:'flow_verdict',label:'Flow Verdict',type:'text'},
      {key:'smart_money',label:'Smart Money',type:'text'},
      {key:'net_lot',label:'Net Lots',type:'int'},
      {key:'net_value',label:'Net Value',type:'int'},
      {key:'last_price',label:'Last Price',type:'int'},
      {key:'buy_lot',label:'Buy Lots',type:'int'},
      {key:'sell_lot',label:'Sell Lots',type:'int'},
      {key:'in_idx30',label:'IDX30',type:'int'},
      {key:'in_lq45',label:'LQ45',type:'int'},
      {key:'in_idx80',label:'IDX80',type:'int'},
    );
  }

  renderColumnList();
  renderSortSelects();
  loadPresets();
  loadStockbitTemplates();
  runQuery();
}

async function loadStockbitTemplates() {
  try {
    const res = await fetch('/api/screener/stockbit/templates');
    const {saved = [], builtin = []} = await res.json();
    const sel = document.getElementById('sbTemplate');
    sel.innerHTML = '<option value="">— None —</option>';
    const seen = new Set(saved.map(t => t.id));
    [...saved, ...builtin.filter(t => !seen.has(t.id))].forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      sel.appendChild(opt);
    });
  } catch(e) {
    console.warn('[screener] Failed to load Stockbit templates:', e);
  }
}

async function loadPresets() {
  try {
    const res = await fetch('/api/screener/presets');
    presets = await res.json();
  } catch(e) {
    presets = {
      graham_value: {columns:'ticker,pe_ttm,pbv,roe,der,div_yield,current_ratio',filters:'pe_ttm<15;pbv<1.5;der<1;current_ratio>2',sort:'pe_ttm',sort_dir:'ASC',label:'Graham Deep Value'},
      garp: {columns:'ticker,pe_ttm,peg_ratio,roe,rev_growth,earn_growth,flow_score',filters:'peg_ratio<1;roe>15;rev_growth>10',sort:'peg_ratio',sort_dir:'ASC',label:'GARP — Growth at Reasonable'},
      dividend: {columns:'ticker,div_yield,pe_ttm,pbv,roe,der,current_ratio',filters:'div_yield>4;roe>8;der<2',sort:'div_yield',sort_dir:'DESC',label:'High Dividend Yield'},
      flow_momentum: {columns:'ticker,flow_score,flow_verdict,smart_money,net_lot,last_price',filters:'flow_score>=3',sort:'flow_score',sort_dir:'DESC',label:'Strong Flow Momentum'},
      quality: {columns:'ticker,roe,roa,npm,der,earn_growth,pe_ttm,pbv',filters:'roe>20;npm>10;der<1.5',sort:'roe',sort_dir:'DESC',label:'Quality Compounders'},
      value: {columns:'ticker,pe_ttm,pbv,div_yield,roe,der,current_ratio',filters:'pe_ttm<10;pbv<1.5;div_yield>3',sort:'pe_ttm',sort_dir:'ASC',label:'Deep Value'},
    };
  }
  const sel = document.getElementById('preset');
  sel.innerHTML = '<option value="">— Custom —</option>';
  Object.entries(presets).forEach(([k,v]) => {
    sel.innerHTML += `<option value="${k}">${v.label}</option>`;
  });
}

// ── Column List ──
function renderColumnList() {
  const el = document.getElementById('colList');
  el.innerHTML = COLUMNS.map(c => {
    const sel = selectedCols.includes(c.key);
    return `<div class="col-item${sel?' selected':''}" onclick="toggleCol('${c.key}')">
      <span class="check">${sel?'✓':''}</span>
      <span class="label" title="${c.key}: ${c.label}">${c.label}</span>
    </div>`;
  }).join('');
  document.getElementById('colCount').textContent = `(${selectedCols.length} selected)`;
}

function toggleCol(key) {
  if (selectedCols.includes(key)) {
    if (selectedCols.length > 1) selectedCols = selectedCols.filter(c => c !== key);
  } else {
    selectedCols.push(key);
  }
  renderColumnList();
  renderSortSelects();
}

function renderSortSelects() {
  const sel = document.getElementById('sortCol');
  sel.innerHTML = selectedCols.map(c => {
    const col = COLUMNS.find(x => x.key === c);
    return `<option value="${c}" ${c===currentSort.col?'selected':''}>${col?.label||c}</option>`;
  }).join('');
  document.getElementById('sortDir').value = currentSort.dir;
}

document.getElementById('sortCol').onchange = function() {
  currentSort.col = this.value;
};
document.getElementById('sortDir').onchange = function() {
  currentSort.dir = this.value;
};
document.getElementById('universe').onchange = function() {
  currentPage = 1; runQuery();
};

function onSbTemplateChange() {
  const val = document.getElementById('sbTemplate').value;
  const badge = document.getElementById('sbBadge');
  const status = document.getElementById('sbStatus');
  if (val) {
    badge.style.display = 'inline';
    badge.textContent = 'ON';
    status.textContent = 'Fetching from Stockbit…';
  } else {
    badge.style.display = 'none';
    status.textContent = '';
  }
  currentPage = 1;
  runQuery();
}

// ── Filters ──
function addFilter(colKey='', op='', val='') {
  filters.push({ col: colKey || selectedCols[0], op: op || '>', val: val || '' });
  renderFilters();
}

function removeFilter(i) {
  filters.splice(i, 1);
  renderFilters();
}

function clearFilters() {
  filters = [];
  renderFilters();
}

function renderFilters() {
  const bar = document.getElementById('filterBar');
  let html = '<span style="font-size:11px;color:var(--text-mute)">Filters:</span> ';
  html += '<button class="btn btn-outline btn-xs" onclick="addFilter()">+ Add Rule</button> ';

  filters.forEach((f, i) => {
    const colOpts = COLUMNS.map(c => `<option value="${c.key}" ${c.key===f.col?'selected':''}>${c.label}</option>`).join('');
    html += `<span class="filter-tag">
      <select onchange="filters[${i}].col=this.value">${colOpts}</select>
      <select onchange="filters[${i}].op=this.value" style="min-width:50px">
        <option value=">" ${f.op==='>'?'selected':''}>&gt;</option>
        <option value="<" ${f.op==='<'?'selected':''}>&lt;</option>
        <option value=">=" ${f.op==='>='?'selected':''}>&gt;=</option>
        <option value="<=" ${f.op==='<='?'selected':''}>&lt;=</option>
        <option value="=" ${f.op==='='?'selected':''}>=</option>
        <option value="!=" ${f.op==='!='?'selected':''}>!=</option>
      </select>
      <input value="${f.val}" onchange="filters[${i}].val=this.value" placeholder="value" style="width:70px">
      <span class="remove" onclick="removeFilter(${i})">×</span>
    </span>`;
  });

  if (filters.length > 0) {
    html += '<button class="btn btn-ghost btn-xs" onclick="clearFilters()">Clear All</button>';
    document.getElementById('clearFiltersBtn').style.display = 'none';
  }
  bar.innerHTML = html;
}

// ── Query ──
async function runQuery() {
  currentSort.col = document.getElementById('sortCol').value;
  currentSort.dir = document.getElementById('sortDir').value;

  const filterStr = filters.map(f => `${f.col}${f.op}${f.val}`).join(';');

  const params = new URLSearchParams({
    columns: selectedCols.join(','),
    universe: document.getElementById('universe').value,
    sort: currentSort.col,
    sort_dir: currentSort.dir,
    filters: filterStr,
    page: currentPage,
    perpage: document.getElementById('perpage').value,
  });
  const sbTemplate = document.getElementById('sbTemplate').value;
  if (sbTemplate) params.set('stockbit_template', sbTemplate);

  document.getElementById('tableWrap').innerHTML = '<div class="loading"><div class="spinner"></div> Running query...</div>';

  try {
    const res = await fetch('/api/screener/fundamental?' + params.toString());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderResults(data);
  } catch(e) {
    // Fallback: call Python directly via the API
    document.getElementById('tableWrap').innerHTML = `<div class="error">API error: ${e.message}<br><small>Check that the /api/screener/fundamental endpoint is registered.</small></div>`;
  }
}

// ── Render ──
function renderResults(data) {
  totalRows = data.total || 0;
  totalPages = data.total_pages || 1;
  currentPage = data.page || 1;

  document.getElementById('resultCount').textContent = `(${totalRows} results)`;

  // SB-1: surface stockbit filter result or error
  const sbStatus = document.getElementById('sbStatus');
  if (sbStatus) {
    if (data.stockbit_error) {
      sbStatus.innerHTML = `⚠️ Stockbit filter failed — ${data.stockbit_error}`;
      sbStatus.style.color = 'var(--amber)';
    } else if (data.stockbit_ticker_count !== undefined) {
      sbStatus.textContent = `${data.stockbit_ticker_count} tickers from Stockbit`;
      sbStatus.style.color = 'var(--text-mute)';
    }
  }

  if (!data.results || data.results.length === 0) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">No results match your criteria.</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const cols = data.columns || [];
  let html = '<table><thead><tr>';
  cols.forEach(c => {
    const sorted = c.key === currentSort.col ? ' sorted' : '';
    const arrow = sorted ? (currentSort.dir === 'ASC' ? ' ▲' : ' ▼') : '';
    html += `<th class="${sorted}" onclick="sortBy('${c.key}')">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  data.results.forEach(row => {
    html += '<tr>';
    cols.forEach(c => {
      const val = row[c.key];
      const cls = getCellClass(c.key, c.type, val);
      html += `<td class="${cls}">${formatVal(val, c.type)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  // Pagination
  renderPagination();
}

function getCellClass(key, type, val) {
  if (key === 'ticker') return 'ticker';
  if (key === 'flow_verdict') {
    if (typeof val === 'string' && val.toUpperCase().includes('BULLISH')) return 'positive';
    if (typeof val === 'string' && val.toUpperCase().includes('BEARISH')) return 'negative';
    return 'neutral';
  }
  if (key === 'smart_money') {
    if (typeof val === 'string' && val.includes('BUY')) return 'positive';
    if (typeof val === 'string' && val.includes('SELL')) return 'negative';
    return 'neutral';
  }
  if (type === 'float' && val !== null) {
    if (val > 0) return 'positive';
    if (val < 0) return 'negative';
  }
  return '';
}

function formatVal(val, type) {
  if (val === null || val === undefined || val === '') return '—';
  if (type === 'float') {
    if (Math.abs(val) < 0.01 && val !== 0) return val.toFixed(4);
    if (Math.abs(val) >= 1e9) return (val/1e9).toFixed(1) + 'B';
    if (Math.abs(val) >= 1e6) return (val/1e6).toFixed(1) + 'M';
    return Number(val).toFixed(2);
  }
  if (type === 'int' && typeof val === 'number') {
    if (Math.abs(val) >= 1e9) return (val/1e9).toFixed(1) + 'B';
    if (Math.abs(val) >= 1e6) return (val/1e6).toFixed(1) + 'M';
    return val.toLocaleString();
  }
  return String(val);
}

function sortBy(col) {
  if (currentSort.col === col) {
    currentSort.dir = currentSort.dir === 'ASC' ? 'DESC' : 'ASC';
  } else {
    currentSort.col = col;
    currentSort.dir = 'ASC';
  }
  document.getElementById('sortCol').value = col;
  document.getElementById('sortDir').value = currentSort.dir;
  currentPage = 1;
  runQuery();
}

// ── Pagination ──
function renderPagination() {
  const el = document.getElementById('pagination');
  el.style.display = 'flex';
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${totalRows} total)`;

  const btnEl = document.getElementById('pageButtons');
  let btns = '';
  btns += `<button onclick="goPage(1)" ${currentPage===1?'disabled':''}>« First</button>`;
  btns += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;

  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  for (let i = start; i <= end; i++) {
    btns += `<button onclick="goPage(${i})" class="${i===currentPage?'active':''}">${i}</button>`;
  }

  btns += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`;
  btns += `<button onclick="goPage(${totalPages})" ${currentPage===totalPages?'disabled':''}>Last »</button>`;
  btnEl.innerHTML = btns;
}

function goPage(p) {
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  runQuery();
  document.getElementById('tableWrap').scrollTop = 0;
}

// ── Presets ──
function loadPreset(name) {
  if (!name || !presets[name]) return;
  const p = presets[name];
  selectedCols = p.columns.split(',');
  currentSort = { col: p.sort, dir: p.sort_dir || 'ASC' };

  // Parse filters
  filters = [];
  if (p.filters) {
    p.filters.split(';').forEach(f => {
      const m = f.match(/^(\w+)([<>=!]+)(.+)$/);
      if (m) filters.push({ col: m[1], op: m[2], val: m[3] });
    });
  }

  renderColumnList();
  renderSortSelects();
  renderFilters();
  document.getElementById('sortCol').value = currentSort.col;
  document.getElementById('sortDir').value = currentSort.dir;
  currentPage = 1;
  runQuery();
}

// ── Export ──
async function exportCSV() {
  const params = new URLSearchParams({
    columns: selectedCols.join(','),
    universe: document.getElementById('universe').value,
    sort: currentSort.col,
    sort_dir: currentSort.dir,
    filters: filters.map(f => `${f.col}${f.op}${f.val}`).join(';'),
    page: 1, perpage: 99999, format: 'csv',
  });

  try {
    const res = await fetch('/api/screener/fundamental?' + params.toString());
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'screener_export.csv';
    a.click(); URL.revokeObjectURL(url);
  } catch(e) {
    // Fallback: client-side CSV
    const filterStr = filters.map(f => `${f.col}${f.op}${f.val}`).join(';');
    const p = new URLSearchParams({
      columns: selectedCols.join(','),
      universe: document.getElementById('universe').value,
      sort: currentSort.col, sort_dir: currentSort.dir,
      filters: filterStr, page: 1, perpage: 99999,
    });
    const res = await fetch('/api/screener/fundamental?' + p.toString());
    const data = await res.json();
    const cols = data.columns || [];
    let csv = cols.map(c => c.label).join(',') + '\n';
    data.results.forEach(row => {
      csv += cols.map(c => {
        const v = row[c.key];
        return v === null || v === undefined ? '' : `"${String(v).replace(/"/g,'""')}"`;
      }).join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'screener_export.csv';
    a.click(); URL.revokeObjectURL(url);
  }
}

// Start
init();
</script>
