name: tests

on:
  push:
    branches: [master]
  pull_request:

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        # The suite is hermetic: it builds its own temp SQLite DBs and never
        # needs the gitignored data/walkforward.db, so no fixtures are required.
        run: python -m pytest -q
